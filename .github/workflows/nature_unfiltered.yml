name: Nature Unfiltered - Video (Buffer)

on:
  schedule:
    # UTC time. Video-only repost, once daily.
    - cron: '0 13 * * *'
  workflow_dispatch: {}    # manual run

permissions:
  contents: write   # needed to commit updated dedupe/state.json back to the repo

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests yt-dlp

      - name: Run poster
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID_NATURE }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python nature_unfiltered.py

      - name: Commit updated state
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update posting state [skip ci]"
          file_pattern: 'dedupe/**'
